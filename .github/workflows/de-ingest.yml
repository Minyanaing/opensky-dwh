# NOT CURRENTLY WORKING FROM GITHUB-HOSTED RUNNERS.
#
# auth.opensky-network.org (and opensky-network.org itself - same origin IP, 194.209.200.34,
# no CDN) times out at the raw TCP level from every ubuntu-latest run we've tried: DNS resolves
# fine, but the connection just hangs and never completes. Forcing IPv4-only resolution
# (fetch_data.py) didn't help either, ruling out a broken-IPv6-route explanation. That pattern -
# consistent failure, silent hang rather than a fast reject, works fine from a normal residential
# connection - points to OpenSky's origin (or something upstream of it) blocking/dropping traffic
# from GitHub Actions' known Azure datacenter IP ranges.
#
# Kept here, not deleted, in case that changes (self-hosted runner, OpenSky allowlisting, etc.).
# For now, run ingestion locally on a schedule instead - see de-pipeline/README.md.
name: OpenSky ingest + land in Databricks

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback window in days"
        required: false
        default: "3"
  repository_dispatch:
    types: [de-ingest]

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: de-pipeline/ingestion
        run: pip install -r requirements.txt

      - name: Network diagnostics (temporary - remove once auth.opensky-network.org is diagnosed)
        continue-on-error: true
        run: |
          echo "== DNS: auth.opensky-network.org =="
          python3 -c "import socket; print(socket.getaddrinfo('auth.opensky-network.org', 443))"
          echo "== DNS: opensky-network.org =="
          python3 -c "import socket; print(socket.getaddrinfo('opensky-network.org', 443))"
          echo "== curl auth host (10s connect timeout) =="
          curl -v --connect-timeout 10 https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token
          echo "== curl api host (10s connect timeout) =="
          curl -v --connect-timeout 10 "https://opensky-network.org/api/states/all"

      - name: Fetch OpenSky flights and land directly in Databricks
        working-directory: de-pipeline/ingestion
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          INGEST_MODE: databricks
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: python pipeline/ingest_opensky.py --lookback-days "${{ github.event.inputs.lookback_days || '3' }}"
