name: Databricks infra deploy

on:
  push:
    branches: [main]
    paths:
      - "de-pipeline/databricks/setup/**"
  workflow_dispatch: {}

jobs:
  databricks-deploy:
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: de-pipeline/databricks
        run: pip install -r requirements.txt

      - name: Apply Databricks landing setup (opensky_raw.bronze)
        working-directory: de-pipeline/databricks/setup
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ADMIN_PRINCIPAL: ${{ secrets.ADMIN_PRINCIPAL }}
        run: python databricks_setup.py --sql-file setup.sql
