name: Databricks ingestion deploy

on:
  push:
    branches: [main, main_qa, main_prod]
    paths:
      - "de-pipeline/ingestion/**"
  workflow_dispatch: {}

jobs:
  databricks-ingestion-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: de-pipeline/ingestion
        run: pip install -r requirements.txt

      - name: Sync ingestion code to Databricks Workspace
        working-directory: de-pipeline/ingestion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: python databricks/deploy_opensky_ingestion.py

      - name: Create/update daily ingestion schedule
        working-directory: de-pipeline/ingestion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: python databricks/schedule_opensky_ingestion.py
